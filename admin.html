<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Administration InvestCI</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        .admin-content { width: 90%; max-width: 900px; text-align: left; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #2563eb; color: white; }
    </style>
</head>
<body>

<!-- Écran de connexion -->
<div id="login-box" class="card">
    <h3>Accès Administrateur</h3>
    <input type="password" id="admin-pass" placeholder="Mot de passe">
    <button onclick="checkPass()">Se connecter</button>
</div>

<!-- Interface Admin -->
<div id="admin-interface" class="card hidden admin-content">
    <h2>Panel Administrateur</h2>
    <p>Bienvenue. Vous avez le contrôle total sur les retraits et les comptes.</p>

    <div style="margin-top: 20px;">
        <h3>Demandes de Retraits</h3>
        <table id="withdrawal-table">
            <tr><th>Email</th><th>Montant</th><th>Numéro</th><th>Action</th></tr>
        </table>
    </div>

    <div style="margin-top: 20px;">
        <h3>Gestion Utilisateurs</h3>
        <table id="user-table">
            <tr><th>Email</th><th>Mot de passe</th><th>Action</th></tr>
        </table>
    </div>

    <button style="background: #dc2626; margin-top: 20px;" onclick="location.reload()">Déconnexion</button>
</div>

<script>
    function checkPass() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === "Williams.225.BAY") {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('admin-interface').classList.remove('hidden');
            loadAdminData();
        } else {
            alert("Mot de passe incorrect !");
        }
    }

    async function loadAdminData() {
        try {
            // Charger les utilisateurs
            const resUsers = await fetch('/api/admin/users');
            const users = await resUsers.json();
            const userTable = document.getElementById('user-table');
            
            // Garder l'en-tête et vider le reste
            userTable.innerHTML = `<tr><th>Email</th><th>Mot de passe</th><th>Action</th></tr>`;
            
            users.forEach(user => {
                userTable.innerHTML += `<tr>
                    <td>${user.email}</td>
                    <td>${user.password || 'N/A'}</td>
                    <td><button style="background:red; padding:5px;" onclick="banUser(${user.id})">Bannir</button></td>
                </tr>`;
            });

            // Charger les retraits
            const resWithdrawals = await fetch('/api/admin/withdrawals');
            const withdrawals = await resWithdrawals.json();
            const withdrawTable = document.getElementById('withdrawal-table');

            withdrawTable.innerHTML = `<tr><th>Email</th><th>Montant</th><th>Numéro</th><th>Action</th></tr>`;
            
            withdrawals.forEach(w => {
                withdrawTable.innerHTML += `<tr>
                    <td>${w.email || 'Utilisateur'}</td>
                    <td>${w.amount} FCFA</td>
                    <td>${w.numero || 'N/A'}</td>
                    <td><button style="background:green; padding:5px;" onclick="validateWithdrawal(${w.id})">Valider</button></td>
                </tr>`;
            });

        } catch (e) {
            console.error("Erreur chargement admin", e);
        }
    }

    async function banUser(userId) {
        if(confirm("Voulez-vous vraiment bannir cet utilisateur ?")) {
            await fetch(`/api/admin/ban/${userId}`, { method: 'POST' });
            loadAdminData();
        }
    }

    async function validateWithdrawal(txId) {
        if(confirm("Valider ce retrait ?")) {
            await fetch(`/api/admin/validate-withdraw/${txId}`, { method: 'POST' });
            loadAdminData();
        }
    }
</script>
</body>
</html>
