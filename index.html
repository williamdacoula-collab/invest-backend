cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestCI</title>
    <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-radius: 12px; border-top: 4px solid #2563eb; }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; border: none; padding: 12px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: #2563eb; }
        .btn-success { background: #10b981; }
        .link-text { color: #2563eb; cursor: pointer; text-align: center; margin-top: 15px; display: block; font-weight: bold; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        .solde-box { font-size: 28px; font-weight: bold; color: #2563eb; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <!-- PAGE DE CONNEXION -->
    <div id="page-connexion" class="card">
        <h2>Connexion à InvestCI</h2>
        <input type="email" id="login-email" placeholder="Adresse Email">
        <input type="password" id="login-password" placeholder="Mot de passe">
        <button class="btn-primary" onclick="connecter()">Se connecter</button>
        <span class="link-text" onclick="afficherPage('page-inscription')">Pas encore de compte ? S'inscrire</span>
    </div>

    <!-- PAGE D'INSCRIPTION -->
    <div id="page-inscription" class="card hidden">
        <h2>Inscription</h2>
        <input type="text" id="reg-name" placeholder="Nom et Prénom">
        <input type="email" id="reg-email" placeholder="Adresse Email">
        <input type="tel" id="reg-tel" placeholder="Numéro de téléphone">
        <input type="password" id="reg-password" placeholder="Mot de passe">
        <button class="btn-success" onclick="inscrire()">S'inscrire</button>
        <span class="link-text" onclick="afficherPage('page-connexion')">Déjà un compte ? Se connecter</span>
    </div>

    <!-- TABLEAU DE BORD -->
    <div id="page-dashboard" class="card hidden">
        <div class="header-flex">
            <h2>Tableau de bord</h2>
            <button class="btn-primary" style="width: auto;" onclick="location.reload()">Déconnexion</button>
        </div>
        <div class="solde-box"><span id="texte-solde">50 000 FCFA</span></div>
    </div>
</div>

<script>
    const API_URL = 'https://invest-backend-j07u.onrender.com';
    let soldeActuel = 50000;

    function afficherPage(pageId) {
        document.getElementById('page-connexion').classList.add('hidden');
        document.getElementById('page-inscription').classList.add('hidden');
        document.getElementById('page-dashboard').classList.add('hidden');
        document.getElementById(pageId).classList.remove('hidden');
    }

    async function inscrire() {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const telephone = document.getElementById('reg-tel').value;
        const password = document.getElementById('reg-password').value;
        
        if (!name || !email || !telephone || !password) {
            alert("Veuillez remplir tous les champs.");
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, email, telephone, password })
            });
            
            if (res.ok) { 
                alert("Inscription réussie !"); 
                afficherPage('page-connexion'); 
            } else {
                const errData = await res.json();
                alert("Erreur : " + (errData.message || "Impossible de s'inscrire."));
            }
        } catch (e) {
            alert("Erreur de connexion au serveur.");
        }
    }

    async function connecter() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const res = await fetch(`${API_URL}/api/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        if (res.ok) {
            const data = await res.json();
            soldeActuel = data.user.solde || 50000;
            document.getElementById('texte-solde').innerText = soldeActuel.toLocaleString() + " FCFA";
            afficherPage('page-dashboard');
        } else alert("Email ou mot de passe incorrect.");
    }
</script>
</body>
</html>
EOF
