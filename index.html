<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>InvestCI</title>
    <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .plan-box { border: 1px solid #e2e8f0; padding: 15px; text-align: center; border-radius: 10px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        button { border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; color: white; margin-top: 5px; }
        .btn-invest { background: #155eef; }
        .btn-depot { background: #10b981; }
        .btn-retrait { background: #dc2626; }
    </style>
</head>
<body>

<div style="max-width: 600px; margin: auto;">
    <div class="card">
        <h3>Solde disponible : 500 000 FCFA</h3>
    </div>

    <div class="card">
        <h3>Investir</h3>
        <div class="plans-grid">
            <div class="plan-box">Mini<br>1000 FCFA<button class="btn-invest" onclick="payer(1000)">Investir</button></div>
            <div class="plan-box">Bronze<br>5000 FCFA<button class="btn-invest" onclick="payer(5000)">Investir</button></div>
            <div class="plan-box">Argent<br>20000 FCFA<button class="btn-invest" onclick="payer(20000)">Investir</button></div>
        </div>
    </div>

    <div class="card">
        <h3>Dépôt</h3>
        <input type="number" id="depot-montant" placeholder="Montant">
        <button class="btn-depot" onclick="payer(document.getElementById('depot-montant').value)">Déposer</button>
        <hr>
        <h3>Retrait</h3>
        <input type="number" id="retrait-montant" placeholder="Montant">
        <input type="text" id="tel-retrait" placeholder="Numéro de téléphone">
        <button class="btn-retrait" onclick="demanderRetrait()">Demander Retrait</button>
    </div>
</div>

<script>
    function payer(montant) {
        if (!montant || montant < 100) return alert("Montant invalide");
        // Utilisation de ta vraie clé Live
        FedaPay.init({
            public_key: 'pk_live_x0OH8aT0wJfax7jLeLzJtQly',
            transaction: { amount: montant, description: 'Transaction InvestCI' }
        }).open();
    }

    function demanderRetrait() {
        const m = document.getElementById('retrait-montant').value;
        const t = document.getElementById('tel-retrait').value;
        if(m && t) alert("Demande de " + m + " FCFA envoyée. Numéro: " + t);
    }
</script>
</body>
</html>
