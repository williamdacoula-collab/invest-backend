<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>InvestApp</title>
    <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
    <style>
        body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; color: white; background: #155eef; }
        .plans { display: flex; gap: 10px; flex-wrap: wrap; }
        .plan { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; flex: 1; min-width: 150px; }
    </style>
</head>
<body>

    <!-- CONNEXION / INSCRIPTION -->
    <div class="card">
        <h3>Connexion / Inscription</h3>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Mot de passe">
        <button>Se connecter</button>
        <button style="background: #10b981;">S'inscrire</button>
    </div>

    <!-- TABLEAU DE BORD -->
    <div class="card">
        <h2>Tableau de bord</h2>
        <div style="font-size: 20px; font-weight: bold;">Solde Actuel : 0 FCFA</div>
        <input type="number" placeholder="Montant en FCFA (min 50)">
        <button style="background: #059669;">Déposer</button>
    </div>

    <!-- PLANS -->
    <div class="card">
        <h3>Plans d'Investissement</h3>
        <div class="plans">
            <div class="plan">Mini<br>1 000 FCFA<br><button>Investir</button></div>
            <div class="plan">Bronze<br>5 000 FCFA<br><button>Investir</button></div>
            <div class="plan">Argent<br>20 000 FCFA<br><button>Investir</button></div>
            <div class="plan">Or<br>50 000 FCFA<br><button>Investir</button></div>
        </div>
    </div>

    <!-- RETRAIT -->
    <div class="card">
        <h3>Effectuer un Retrait</h3>
        <input type="number" placeholder="Montant en FCFA">
        <input type="text" placeholder="Numéro de téléphone">
        <button style="background: #dc2626;">Retirer</button>
        <div style="margin-top:20px;">Moyens de paiement acceptés : Wave, MTN, Moov, Orange</div>
    </div>

</body>
</html>
