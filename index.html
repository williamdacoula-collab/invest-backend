<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>InvestCI - Dépôt & Retrait</title>
    <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; }
        .card { background: white; border-radius: 18px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.06); }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; color: white; margin-top: 10px; }
        .depot-btn { background: #12b76a; }
        .retrait-btn { background: #dc2626; }
    </style>
</head>
<body>

<div class="card">
    <h3>Gestion du Solde</h3>
    
    <!-- Dépôt -->
    <div class="input-group">
        <label>Montant pour Dépôt (FCFA)</label>
        <input type="number" id="montant-depot" placeholder="Ex: 1000">
        <button class="depot-btn" id="btn-depot">Déposer</button>
    </div>

    <hr style="margin: 20px 0;">

    <!-- Retrait -->
    <div class="input-group">
        <label>Montant pour Retrait (FCFA)</label>
        <input type="number" id="montant-retrait" placeholder="Ex: 500">
        <label style="display:block; margin-top:10px;">Votre Numéro de téléphone</label>
        <input type="text" id="numero-tel" placeholder="Ex: 07XXXXXXXX">
        <button class="retrait-btn" id="btn-retrait">Demander Retrait</button>
    </div>
</div>

<script>
    const PUBLIC_KEY = 'pk_live_x0OH8aT0wJfax7jLeLzJtQly';

    // Dépôt
    document.getElementById('btn-depot').addEventListener('click', () => {
        const montant = parseInt(document.getElementById('montant-depot').value);
        if(!montant || montant < 50) return alert("Montant invalide");
        FedaPay.init({ public_key: PUBLIC_KEY, transaction: { amount: montant, description: 'Dépôt' } }).open();
    });

    // Retrait
    document.getElementById('btn-retrait').addEventListener('click', () => {
        const montant = document.getElementById('montant-retrait').value;
        const tel = document.getElementById('numero-tel').value;
        if(!montant || !tel) return alert("Remplissez le montant et le numéro");
        alert("Demande de retrait de " + montant + " FCFA envoyée au numéro " + tel + ". En attente de validation admin.");
    });
</script>
</body>
</html>
