<!DOCTYPE html>
<html>
<body>
    <h1>Administration - Retraits en attente</h1>
    <table>
        <thead><tr><th>ID</th><th>User</th><th>Montant</th><th>Action</th></tr></thead>
        <tbody id="withdraw-table"></tbody>
    </table>

    <script>
        fetch('/api/transactions?type=RETRAIT&status=EN_ATTENTE')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('withdraw-table');
                data.forEach(t => {
                    tbody.innerHTML += `<tr>
                        <td>${t.id}</td><td>${t.user_id}</td><td>${t.amount}</td>
                        <td><button onclick="valider(${t.id})">Valider</button></td>
                    </tr>`;
                });
            });

        function valider(id) {
            fetch('/api/admin/validate-withdraw', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ transaction_id: id })
            }).then(() => location.reload());
        }
    </script>
</body>
</html>
